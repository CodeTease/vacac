[package]
name = "vacac"
version = "0.3.0"
edition = "2024"
description = "A small static compiler for the Vaca language"

[dependencies]
inkwell = { version = "0.11.0", features = ["llvm23-1"] }

[features]
# Release artifacts link LLVM statically so they do not need libLLVM at runtime.
static-llvm = ["inkwell/llvm23-1-force-static"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

