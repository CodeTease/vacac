name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LLVM_SYS_231_PREFIX: /usr/lib/llvm-23
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 23
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 23
          sudo apt-get install -y llvm-23-dev libpolly-23-dev libzstd-dev zlib1g-dev

      - name: Install Rust 1.100.0
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.100.0
          cache: false

      - name: Verify tools
        run: |
          llvm-config-23 --version
          cc --version
          rustc --version
          cargo --version

      - name: Build release binary
        run: cargo build --release --locked --features static-llvm

      - name: Smoke test
        run: |
          ./target/release/vacac --version
          output="$(./target/release/vacac -q examples/factorial.vca --run)"
          test "$output" = "3628800"

      - name: Verify static LLVM linkage
        run: |
          ldd target/release/vacac
          if ldd target/release/vacac | grep -q libLLVM; then
            echo "error: vacac is dynamically linked against libLLVM" >&2
            exit 1
          fi

      - name: Package
        run: |
          name="vacac-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${name}"
          install -m 755 target/release/vacac "dist/${name}/vacac"
          install -m 644 README.md "dist/${name}/README.md"
          install -m 644 LICENSE "dist/$(name)/LICENSE"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
          cd dist
          sha256sum "${name}.tar.gz" > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --verify-tag \
              --title "$tag" \
              --generate-notes
          fi
